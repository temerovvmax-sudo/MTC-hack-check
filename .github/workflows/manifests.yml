---
name: manifests
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install yamllint
        run: python3 -m pip install --user yamllint
      - name: Install Helm
        run: |
          curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz
          tar -C /tmp -xzf /tmp/helm.tgz
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -C /tmp -xzf /tmp/kc.tgz kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Validate manifests
        run: make lint
