---
- name: Check the kubeadm inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [inventory]
  environment:
    KUBECONFIG: "{{ lab_kubeconfig }}"
  tasks:
    - ansible.builtin.import_tasks: tasks/guard.yml
    - ansible.builtin.import_tasks: tasks/check-inventory.yml

- name: Prepare the operator machine and build images
  hosts: localhost
  connection: local
  gather_facts: true
  environment:
    KUBECONFIG: "{{ lab_kubeconfig }}"
    DEBIAN_FRONTEND: noninteractive
  tasks:
    - ansible.builtin.import_tasks: tasks/operator.yml

- name: Prepare the Debian 12 or Ubuntu 24.04 nodes
  hosts: k8s_nodes
  become: true
  gather_facts: false
  environment:
    DEBIAN_FRONTEND: noninteractive
  tasks:
    - ansible.builtin.import_tasks: tasks/node-prep.yml

- name: Import lab images into containerd
  hosts: k8s_nodes
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.import_tasks: tasks/import-images.yml

- name: Initialise the control plane
  hosts: control_plane
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.import_tasks: tasks/kubeadm-init.yml

- name: Install Calico
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ lab_kubeconfig }}"
  tasks:
    - ansible.builtin.import_tasks: tasks/calico.yml

- name: Join workers and gateway nodes
  hosts: workers:gateways
  become: true
  gather_facts: false
  tasks:
    - ansible.builtin.import_tasks: tasks/kubeadm-join.yml

- name: Label nodes and install MetalLB
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ lab_kubeconfig }}"
  tasks:
    - ansible.builtin.import_tasks: tasks/platform.yml

- name: Install TestY, the Gateway and observability
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    KUBECONFIG: "{{ lab_kubeconfig }}"
  tasks:
    - ansible.builtin.import_tasks: tasks/workloads.yml
