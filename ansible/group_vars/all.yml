---
repo_root: "{{ playbook_dir | dirname }}"
lab_kubeconfig: "{{ repo_root }}/.kube/lab.config"
lab_minikube_home: "{{ repo_root }}/.minikube"
lab_secrets_dir: "{{ repo_root }}/.secrets"
lab_credentials_env: "{{ lab_secrets_dir }}/lab-credentials.env"
lab_credentials_json: "{{ lab_secrets_dir }}/lab-credentials.json"
lab_tls_dir: "{{ lab_secrets_dir }}/tls"
lab_cache: "{{ repo_root }}/.cache"
testy_src: "{{ lab_cache }}/testy-src"

testy_git_url: "https://gitlab-pub.yadro.com/testy/testy.git"
testy_git_ref: "release/2.1.3"
testy_git_commit: "3544c0f34640443c499fde2f9a52be30c863c519"
testy_version: "2.1.3"

minikube_version: "v1.39.0"
kubernetes_version: "v1.37.0"
kubernetes_minor: "1.37"
kubernetes_apt_version: "1.37.0-1.1"
cri_tools_apt_version: "1.37.0-1.1"
kubernetes_cni_apt_version: "1.9.1-1.1"
containerd_apt_version_debian: "1.6.20~ds1-1+deb12u3"
containerd_apt_version_ubuntu: "2.2.1-0ubuntu1~24.04.3"
kubectl_version: "v1.37.0"
helm_version: "v3.22.0"
kubeconform_version: "v0.8.0"
calico_version: "v3.32.2"
metallb_chart_version: "0.16.1"
metallb_version: "v0.16.1"
local_path_version: "v0.0.37"
pod_cidr: "192.168.0.0/16"
service_cidr: "10.96.0.0/12"
kube_proxy_mode: "iptables"
smoke_profile: testy-smoke
smoke_nodes: 1
smoke_cpus: "2"
smoke_memory_mb: "3072"
smoke_disk: "12g"
smoke_min_available_ram_mb: 4096
smoke_os_reserve_mb: 1024
smoke_node_heap: "1536"

envoy_gateway_chart_version: "v1.9.2"
kube_prometheus_stack_version: "91.8.2"
loki_chart_version: "6.55.0"
prometheus_version: "v3.15.0-distroless"
prometheus_operator_version: "v0.94.1"
alertmanager_version: "v0.34.1"
grafana_version: "13.2.3"
loki_version: "3.7.8"
fluentd_version: "1.19.3"
fluent_plugin_loki_version: "1.3.0"
fluent_plugin_k8s_meta_version: "3.8.0"

postgres_image: "postgres:14.5-alpine"
redis_image: "redis:7.4.6-alpine"
pgbouncer_image: "edoburu/pgbouncer:1.22.1-p0"
nginx_image: "nginxinc/nginx-unprivileged:1.27.5-alpine"
backend_image: "testy-backend:2.1.3"
frontend_image: "testy-frontend:2.1.3"
fluentd_image: "testy-fluentd:1.19.3"

app_pool_label: "testy.yadro.dev/pool"
gateway_taint_value: "gateway"
app_pool_value: "app"
