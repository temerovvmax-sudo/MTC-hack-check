# Лабораторный инвентарь. Копия лежит в hosts.ini.
# Имя хоста в инвентаре совпадает с hostname ВМ: kubeadm называет узел этим именем.
# metallb_vip не назначается ни одному интерфейсу. Это свободный адрес той же L2-сети.
# ansible_ssh_private_key_file не задан: OpenSSH берёт ключ по умолчанию.
# Приватный ключ в этот файл и в git не кладут.

[control_plane]
k8s-testy-cp ansible_host=192.168.15.120

[workers]
k8s-testy-w1 ansible_host=192.168.15.121
k8s-testy-w2 ansible_host=192.168.15.122
k8s-testy-w3 ansible_host=192.168.15.123

[gateways]
k8s-testy-gw1 ansible_host=192.168.15.124
k8s-testy-gw2 ansible_host=192.168.15.125

[k8s_nodes:children]
control_plane
workers
gateways

[all:vars]
ansible_user=m.temerov
ansible_python_interpreter=/usr/bin/python3
metallb_vip=192.168.15.126
ui_host=testy.local
api_host=api.testy.local
