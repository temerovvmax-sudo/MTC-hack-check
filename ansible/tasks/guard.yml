---
- name: Refuse any kubeconfig other than a lab file in this repository
  ansible.builtin.assert:
    that:
      - lab_kubeconfig is regex('/\\.kube/(lab|smoke)\\.config$')
      - lab_kubeconfig is not regex('/\\.kube/config$')
      - lookup('env', 'KUBECONFIG') == '' or lookup('env', 'KUBECONFIG') is match('^.*/\\.kube/(lab|smoke)\\.config$')
    fail_msg: "Refusing to run unless KUBECONFIG is a lab file under the repository .kube/ directory."

- name: Create lab directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ repo_root }}/.kube"
    - "{{ lab_secrets_dir }}"
    - "{{ lab_cache }}"
