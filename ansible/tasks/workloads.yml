---
- name: Render Gateway, TestY and network policy for this inventory
  ansible.builtin.command: >-
    python3 {{ repo_root }}/scripts/render-lab-manifests.py render
    {{ repo_root }} {{ ui_host }} {{ api_host }} {{ metallb_vip }}
    {{ node_cidr }} {{ control_plane_ip }} {{ pod_cidr }} {{ service_cidr }}
    {{ node_ips }} {{ lab_cache }}/rendered-lab
  changed_when: true

- name: Apply namespaces
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    kubectl apply -f {{ repo_root }}/k8s/namespaces.yaml
  changed_when: true

- name: Apply default-deny network policies
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    kubectl apply -f {{ lab_cache }}/rendered-lab/policies.yaml
  changed_when: true

- name: Load credentials
  ansible.builtin.include_vars:
    file: "{{ lab_credentials_json }}"

- name: Create the TestY secret from the lab credentials
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      {{ repo_root }}/scripts/with-lab-kubeconfig.sh kubectl -n testy create secret generic testy-secrets \
        --from-literal=POSTGRES_PASSWORD='{{ POSTGRES_PASSWORD }}' \
        --from-literal=SECRET_KEY='{{ SECRET_KEY }}' \
        --from-literal=SUPERUSER_PASSWORD='{{ SUPERUSER_PASSWORD }}' \
        --dry-run=client -o yaml | {{ repo_root }}/scripts/with-lab-kubeconfig.sh kubectl apply -f -
    executable: /bin/bash
  no_log: true
  changed_when: true

- name: Create the Gateway TLS secret
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    kubectl -n testy create secret tls testy-gateway-tls
    --cert={{ lab_tls_dir }}/tls.crt
    --key={{ lab_tls_dir }}/tls.key
    --dry-run=client -o yaml
  register: tls_secret
  changed_when: false
  no_log: true

- name: Apply the Gateway TLS secret
  ansible.builtin.shell: |
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh kubectl apply -f -
  args:
    stdin: "{{ tls_secret.stdout }}"
  no_log: true
  changed_when: true

- name: Create the Grafana admin secret
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      {{ repo_root }}/scripts/with-lab-kubeconfig.sh kubectl -n monitoring create secret generic lab-grafana-admin \
        --from-literal=admin-user='{{ GRAFANA_ADMIN_USER }}' \
        --from-literal=admin-password='{{ GRAFANA_ADMIN_PASSWORD }}' \
        --dry-run=client -o yaml | {{ repo_root }}/scripts/with-lab-kubeconfig.sh kubectl apply -f -
    executable: /bin/bash
  no_log: true
  changed_when: true

- name: Add Helm chart repositories
  ansible.builtin.shell: |
    set -eu
    helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    helm repo add grafana https://grafana.github.io/helm-charts
    helm repo update
  changed_when: false

- name: Install or upgrade Envoy Gateway
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    helm upgrade --install eg oci://docker.io/envoyproxy/gateway-helm
    --version {{ envoy_gateway_chart_version }}
    --namespace envoy-gateway-system
    --create-namespace
    -f {{ repo_root }}/k8s/gateway/values-envoy.yaml
    --wait --timeout 10m
  changed_when: true

- name: Apply TestY data, the application and the Gateway
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    kubectl apply -f {{ item }}
  loop:
    - "{{ repo_root }}/k8s/testy/rbac.yaml"
    - "{{ lab_cache }}/rendered-lab/data.yaml"
    - "{{ lab_cache }}/rendered-lab/app.yaml"
    - "{{ lab_cache }}/rendered-lab/gateway.yaml"
  changed_when: true

- name: Install or upgrade Loki
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    helm upgrade --install loki grafana/loki
    --version {{ loki_chart_version }}
    --namespace logging
    -f {{ repo_root }}/k8s/monitoring/values-loki.yaml
    --wait --timeout 10m
  changed_when: true

- name: Allow node-exporter in the monitoring namespace
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    kubectl label namespace monitoring
    pod-security.kubernetes.io/enforce=privileged
    pod-security.kubernetes.io/audit=privileged
    pod-security.kubernetes.io/warn=privileged
    --overwrite
  changed_when: true

- name: Install or upgrade kube-prometheus-stack
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack
    --version {{ kube_prometheus_stack_version }}
    --namespace monitoring
    -f {{ repo_root }}/k8s/monitoring/values-prometheus.yaml
    --wait --timeout 40m
  changed_when: true

- name: Apply Fluentd and the Grafana dashboards
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    kubectl apply -f {{ item }}
  loop:
    - "{{ repo_root }}/k8s/logging/fluentd.yaml"
    - "{{ repo_root }}/k8s/monitoring/dashboards.yaml"
  changed_when: true

- name: Wait for PostgreSQL
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    kubectl -n testy rollout status statefulset/testy-postgres --timeout=600s
  changed_when: false

- name: Wait for TestY and the data plane
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    kubectl -n testy rollout status deployment/{{ item }} --timeout=600s
  loop:
    - testy-redis
    - testy-pgbouncer
    - testy-backend
    - testy-celery
    - testy-notifications
    - testy-frontend
  changed_when: false

- name: Wait for Fluentd
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    kubectl -n logging rollout status daemonset/fluentd --timeout=300s
  changed_when: false

- name: Wait for the Envoy data plane
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    kubectl -n envoy-gateway-system wait --for=condition=Available deployment
    -l gateway.envoyproxy.io/owning-gateway-name=testy --timeout=300s
  changed_when: false

- name: Wait until MetalLB assigns the Gateway VIP
  ansible.builtin.shell: |
    set -eu
    ip="$({{ repo_root }}/scripts/with-lab-kubeconfig.sh kubectl get svc -A \
      -l gateway.envoyproxy.io/owning-gateway-name=testy \
      -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}')"
    test "${ip}" = "{{ metallb_vip }}"
  register: gateway_vip
  changed_when: false
  retries: 24
  delay: 5
  until: gateway_vip.rc == 0

- name: Record versions observed in the cluster
  ansible.builtin.command: >-
    {{ repo_root }}/scripts/with-lab-kubeconfig.sh
    python3 {{ repo_root }}/scripts/record-cluster-versions.py
    {{ lab_secrets_dir }}/installed-versions.txt
  environment:
    CONTAINERD_VERSION: "{{ containerd_version }}"
    RUNC_VERSION: "{{ runc_version }}"
    POD_CIDR: "{{ pod_cidr }}"
    SERVICE_CIDR: "{{ service_cidr }}"
    NODE_CIDR: "{{ node_cidr }}"
    METALLB_VIP: "{{ metallb_vip }}"
    UI_HOST: "{{ ui_host }}"
    API_HOST: "{{ api_host }}"
    KUBE_PROMETHEUS_STACK_VERSION: "{{ kube_prometheus_stack_version }}"
    PROMETHEUS_OPERATOR_VERSION: "{{ prometheus_operator_version }}"
    ALERTMANAGER_VERSION: "{{ alertmanager_version }}"
    PROMETHEUS_VERSION: "{{ prometheus_version }}"
    GRAFANA_VERSION: "{{ grafana_version }}"
    LOKI_VERSION: "{{ loki_version }}"
    LOKI_CHART_VERSION: "{{ loki_chart_version }}"
    ENVOY_GATEWAY_CHART_VERSION: "{{ envoy_gateway_chart_version }}"
  changed_when: true
