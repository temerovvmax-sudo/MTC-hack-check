---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: testy-fluentd
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: testy-fluentd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: testy-fluentd
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: logging
data:
  fluent.conf: |
    <source>
      @type monitor_agent
      bind 0.0.0.0
      port 24220
    </source>
    <source>
      @type tail
      @id tail_testy_access
      path /var/log/containers/*_testy_accesslog-*.log,/var/log/containers/*_testy_backend-*.log,/var/log/containers/*_testy_envoy-*.log
      pos_file /fluentd/pos/testy.pos
      tag kube.*
      read_from_head true
      refresh_interval 5
      <parse>
        @type none
      </parse>
    </source>
    <filter kube.**>
      @type kubernetes_metadata
      @id kube_meta
    </filter>
    <match kube.**>
      @type loki
      url "http://loki.logging.svc.cluster.local:3100"
      extra_labels {"job":"testy-access"}
      line_format json
      remove_keys kubernetes
      <buffer>
        @type memory
        flush_mode interval
        flush_interval 2s
        retry_forever true
        overflow_action block
      </buffer>
    </match>
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: logging
  labels:
    app.kubernetes.io/name: fluentd
    app.kubernetes.io/part-of: testy-lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluentd
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluentd
        app.kubernetes.io/part-of: testy-lab
    spec:
      serviceAccountName: fluentd
      automountServiceAccountToken: true
      tolerations:
        - operator: Exists
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups:
          - 0
      initContainers:
        - name: tmp-perms
          image: testy-fluentd:1.19.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/chmod", "1777", "/tmp"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: fluentd
          image: testy-fluentd:1.19.3
          imagePullPolicy: IfNotPresent
          env:
            - name: FLUENTD_CONF
              value: fluent.conf
          ports:
            - name: monitor
              containerPort: 24220
          volumeMounts:
            - name: config
              mountPath: /fluentd/etc/fluent.conf
              subPath: fluent.conf
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /fluentd/pos
            - name: log
              mountPath: /fluentd/log
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/plugins.json
              port: monitor
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: fluentd-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: state
          emptyDir: {}
        - name: log
          emptyDir: {}
        - name: tmp
          emptyDir: {}
