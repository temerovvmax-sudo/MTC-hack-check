---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: testy-gateway
  namespace: metallb-system
spec:
  addresses:
    - 192.168.15.126/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: testy-gateway
  namespace: metallb-system
spec:
  ipAddressPools:
    - testy-gateway
  nodeSelectors:
    - matchLabels:
        testy.yadro.dev/pool: gateway
