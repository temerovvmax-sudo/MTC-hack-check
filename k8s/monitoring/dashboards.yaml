---
apiVersion: v1
kind: ConfigMap
metadata:
  name: testy-lab-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  metrics.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "expr": "sum by (job) (up)",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ],
          "title": "Prometheus targets UP by job",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "tags": [
        "testy",
        "metrics"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "TestY lab metrics",
      "uid": "testy-lab-metrics",
      "version": 1
    }
  logs.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "panels": [
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "dedupStrategy": "none",
            "showTime": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "expr": "{job=\"testy-access\"} |= \"testy-access\"",
              "refId": "A"
            }
          ],
          "title": "TestY access logs",
          "type": "logs"
        }
      ],
      "schemaVersion": 39,
      "tags": [
        "testy",
        "logs"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "TestY lab logs",
      "uid": "testy-lab-logs",
      "version": 1
    }
