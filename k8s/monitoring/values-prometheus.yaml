---
crds:
  enabled: true
alertmanager:
  alertmanagerSpec:
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      tag: v0.34.1
    nodeSelector:
      testy.yadro.dev/pool: app
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 192Mi
grafana:
  initChownData:
    enabled: false
  image:
    tag: "13.2.3"
  admin:
    existingSecret: lab-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  nodeSelector:
    testy.yadro.dev/pool: app
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      uid: prometheus
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
      isDefault: false
prometheus:
  prometheusSpec:
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.15.0-distroless
    retention: 12h
    retentionSize: 4GB
    nodeSelector:
      testy.yadro.dev/pool: app
    podMetadata:
      labels:
        testy.yadro.dev/workload: prometheus
    podAntiAffinity: ""
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                testy.yadro.dev/workload: postgres
            namespaces:
              - testy
            topologyKey: kubernetes.io/hostname
          - labelSelector:
              matchLabels:
                testy.yadro.dev/workload: loki
            namespaces:
              - logging
            topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 8Gi
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
kube-state-metrics:
  nodeSelector:
    testy.yadro.dev/pool: app
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
prometheus-node-exporter:
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 64Mi
prometheusOperator:
  image:
    registry: quay.io
    repository: prometheus-operator/prometheus-operator
    tag: v0.94.1
  prometheusConfigReloader:
    image:
      registry: quay.io
      repository: prometheus-operator/prometheus-config-reloader
      tag: v0.94.1
  nodeSelector:
    testy.yadro.dev/pool: app
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
