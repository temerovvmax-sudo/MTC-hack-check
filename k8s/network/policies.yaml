---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-from-clients
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: testy
  policyTypes:
    - Ingress
  ingress:
    # Listener ports are shifted by 10000 (80 -> 10080, 443 -> 10443).
    # 80 and 443 stay open so a proxy that listens on the listener port still passes make verify.
    - ports:
        - protocol: TCP
          port: 10080
        - protocol: TCP
          port: 10443
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
