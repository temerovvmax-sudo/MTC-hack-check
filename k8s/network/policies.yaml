apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-to-data
  namespace: testy
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - testy-backend
          - testy-celery
          - testy-notifications
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: testy-pgbouncer
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: testy-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: testy-backend
      ports:
        - protocol: TCP
          port: 8080
