---
apiVersion: v1
kind: ConfigMap
metadata:
  name: testy-accesslog-nginx
  namespace: testy
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events {
        worker_connections 512;
    }
    http {
        map $http_upgrade $connection_upgrade {
            default upgrade;
            "" close;
        }
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;
        log_format testy_access 'testy-access remote=$remote_addr request="$request" status=$status bytes=$body_bytes_sent host=$host';
        access_log /dev/stdout testy_access;
        server {
            listen 8080;
            client_max_body_size 256m;
            location / {
                proxy_pass http://127.0.0.1:8000;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testy-backend
  namespace: testy
  labels:
    app.kubernetes.io/name: testy-backend
    app.kubernetes.io/part-of: testy-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: testy-backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: testy-backend
        app.kubernetes.io/part-of: testy-lab
    spec:
      nodeSelector:
        testy.yadro.dev/pool: app
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: testy-backend:2.1.3
          imagePullPolicy: IfNotPresent
          command: ["/testy/scripts/entrypoint.sh"]
          args: ["serve"]
          ports:
            - name: app
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: testy-config
            - secretRef:
                name: testy-secrets
          volumeMounts:
            - name: media
              mountPath: /testy/media
          startupProbe:
            httpGet:
              path: /healthcheck/
              port: app
              httpHeaders:
                - name: Host
                  value: api.testy.local
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthcheck/
              port: app
              httpHeaders:
                - name: Host
                  value: api.testy.local
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck/
              port: app
              httpHeaders:
                - name: Host
                  value: api.testy.local
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: accesslog
          image: nginxinc/nginx-unprivileged:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthcheck/
              port: http
              httpHeaders:
                - name: Host
                  value: api.testy.local
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /healthcheck/
              port: http
              httpHeaders:
                - name: Host
                  value: api.testy.local
            periodSeconds: 10
            failureThreshold: 36
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: testy-media
        - name: nginx-conf
          configMap:
            name: testy-accesslog-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: testy-backend
  namespace: testy
spec:
  selector:
    app.kubernetes.io/name: testy-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: testy-backend
  namespace: testy
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: testy-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testy-celery
  namespace: testy
  labels:
    app.kubernetes.io/name: testy-celery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: testy-celery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: testy-celery
        app.kubernetes.io/part-of: testy-lab
    spec:
      nodeSelector:
        testy.yadro.dev/pool: app
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: testy-backend
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-backend
          image: testy-backend:2.1.3
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import time, urllib.request
              url = "http://testy-backend:8080/healthcheck/"
              for _ in range(180):
                  try:
                      req = urllib.request.Request(url, headers={"Host": "api.testy.local"})
                      with urllib.request.urlopen(req, timeout=3) as resp:
                          if resp.status == 200:
                              raise SystemExit(0)
                  except SystemExit:
                      raise
                  except Exception:
                      time.sleep(2)
              raise SystemExit("backend not ready")
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      containers:
        - name: celery
          image: testy-backend:2.1.3
          imagePullPolicy: IfNotPresent
          args: ["celery", "-A", "root", "worker", "-B", "-l", "INFO"]
          envFrom:
            - configMapRef:
                name: testy-config
            - secretRef:
                name: testy-secrets
          volumeMounts:
            - name: media
              mountPath: /testy/media
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os
                  for pid in os.listdir("/proc"):
                      if not pid.isdigit():
                          continue
                      try:
                          cmd = open(f"/proc/{pid}/cmdline", "rb").read().replace(b"\x00", b" ").decode()
                      except OSError:
                          continue
                      if "celery" in cmd and "worker" in cmd:
                          raise SystemExit(0)
                  raise SystemExit(1)
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: testy-media
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: testy-celery
  namespace: testy
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: testy-celery
