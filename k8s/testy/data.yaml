---
apiVersion: v1
kind: ConfigMap
metadata:
  name: testy-config
  namespace: testy
  labels:
    app.kubernetes.io/part-of: testy-lab
data:
  POSTGRES_NAME: testy
  POSTGRES_USER: testy
  POSTGRES_SERVICE_HOST: testy-pgbouncer
  POSTGRES_SERVICE_PORT: "5432"
  REDIS_HOST: testy-redis
  REDIS_PORT: "6379"
  CELERY_BROKER_URL: redis://testy-redis:6379/0
  CELERY_RESULT_BACKEND: redis://testy-redis:6379/1
  ALLOWED_HOSTS: '["api.testy.local","testy.local","testy-backend","testy-backend.testy.svc","testy-backend.testy.svc.cluster.local","localhost"]'
  CSRF_TRUSTED_ORIGINS: '["https://testy.local","https://api.testy.local"]'
  COMPANY_DOMAIN: testy.local
  SUPERUSER_USERNAME: admin
  TESTY_ALLOW_FILE_RESPONSE: "True"
  DJANGO_SETTINGS_MODULE: root.settings.production
  WEB_CONCURRENCY: "2"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: testy-postgres
  namespace: testy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: testy-redis
  namespace: testy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: testy-media
  namespace: testy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: testy-postgres
  namespace: testy
  labels:
    app.kubernetes.io/name: testy-postgres
    app.kubernetes.io/part-of: testy-lab
spec:
  serviceName: testy-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: testy-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: testy-postgres
        app.kubernetes.io/part-of: testy-lab
        testy.yadro.dev/workload: postgres
    spec:
      serviceAccountName: testy-postgres
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  testy.yadro.dev/workload: prometheus
              namespaces:
                - monitoring
              topologyKey: kubernetes.io/hostname
            - labelSelector:
                matchLabels:
                  testy.yadro.dev/workload: loki
              namespaces:
                - logging
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      nodeSelector:
        testy.yadro.dev/pool: app
      securityContext:
        fsGroup: 70
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:14.5-alpine
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - max_connections=100
            - -c
            - password_encryption=scram-sha-256
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: testy
            - name: POSTGRES_DB
              value: testy
            - name: POSTGRES_PASSWORD_FILE
              value: /secrets/postgres/POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
            - name: postgres-password
              mountPath: /secrets/postgres
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "testy", "-d", "testy"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "testy", "-d", "testy"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: testy-postgres
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: postgres-password
          secret:
            secretName: testy-secrets
            defaultMode: 0444
            items:
              - key: POSTGRES_PASSWORD
                path: POSTGRES_PASSWORD
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: testy-postgres
  namespace: testy
spec:
  selector:
    app.kubernetes.io/name: testy-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: testy-postgres
  namespace: testy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: testy-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testy-redis
  namespace: testy
  labels:
    app.kubernetes.io/name: testy-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: testy-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: testy-redis
        app.kubernetes.io/part-of: testy-lab
    spec:
      serviceAccountName: testy-redis
      automountServiceAccountToken: false
      nodeSelector:
        testy.yadro.dev/pool: app
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.6-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: testy-redis
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: testy-redis
  namespace: testy
spec:
  selector:
    app.kubernetes.io/name: testy-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: testy-redis
  namespace: testy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: testy-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testy-pgbouncer
  namespace: testy
  labels:
    app.kubernetes.io/name: testy-pgbouncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: testy-pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: testy-pgbouncer
        app.kubernetes.io/part-of: testy-lab
    spec:
      serviceAccountName: testy-pgbouncer
      automountServiceAccountToken: false
      nodeSelector:
        testy.yadro.dev/pool: app
      securityContext:
        fsGroup: 70
        runAsUser: 70
        runAsGroup: 70
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:1.22.1-p0
          imagePullPolicy: IfNotPresent
          ports:
            - name: pgbouncer
              containerPort: 5432
          env:
            - name: DB_USER
              value: testy
            - name: DB_HOST
              value: testy-postgres
            - name: DB_NAME
              value: testy
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: testy-secrets
                  key: POSTGRES_PASSWORD
            - name: POOL_MODE
              value: transaction
            - name: AUTH_TYPE
              value: scram-sha-256
            - name: ADMIN_USERS
              value: testy
            - name: MAX_CLIENT_CONN
              value: "200"
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
            - name: log
              mountPath: /var/log/pgbouncer
            - name: run
              mountPath: /var/run/pgbouncer
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          emptyDir: {}
        - name: log
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: testy-pgbouncer
  namespace: testy
spec:
  selector:
    app.kubernetes.io/name: testy-pgbouncer
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: pgbouncer
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: testy-pgbouncer
  namespace: testy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: testy-pgbouncer
